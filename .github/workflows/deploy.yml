name: Deploy szbolent.cn stack

# push main → CI 自动收敛目标机（零手动 SSH）；目标机信息全部走 Secrets
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # 自托管 runner（Vultr，固定 IP 已入目标机 SSH 白名单）——
    # GitHub 托管 runner 的出口 IP 是动态的，永远过不了目标机的 SSH 白名单。
    runs-on: [self-hosted, aliyun-deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          config: |
            Host deploy
              HostName ${{ secrets.DEPLOY_HOST }}
              User ${{ secrets.DEPLOY_USER }}
              StrictHostKeyChecking no

      - name: Ensure dirs
        run: ssh deploy 'mkdir -p /opt/szbolent-cn /data/pgvector'

      - name: Rsync compose / nginx / scripts / mu-plugins / htaccess / bookstore-data
        run: |
          rsync -avz docker-compose.yml deploy:/opt/szbolent-cn/
          rsync -avz nginx/ deploy:/opt/szbolent-cn/nginx/
          rsync -avz scripts/ deploy:/opt/szbolent-cn/scripts/
          rsync -avz mu-plugins/ deploy:/opt/szbolent-cn/mu-plugins/
          rsync -avz htaccess deploy:/opt/szbolent-cn/htaccess
          # 9,417 首陆游作品全集（Phase A 导入用）；目录不存在则跳过
          if [ -d bookstore-data ]; then rsync -avz bookstore-data/ deploy:/opt/szbolent-cn/bookstore-data/; fi
          # Phase B：modown 主题/插件（由 sync-modown-from-genz.sh 预填，缺则跳过）
          if [ -d themes ]; then rsync -avz themes/ deploy:/opt/szbolent-cn/themes/; fi
          if [ -d plugins ]; then rsync -avz plugins/ deploy:/opt/szbolent-cn/plugins/; fi

      - name: Write .env (first time only)
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          PGVECTOR_PASSWORD: ${{ secrets.PGVECTOR_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          ICP_LICENSE: ${{ secrets.ICP_LICENSE }}
        run: |
          ssh deploy "cd /opt/szbolent-cn && if [ ! -f .env ]; then
            printf 'MYSQL_ROOT_PASSWORD=%s\nMYSQL_DATABASE=bolent_wp\nMYSQL_USER=wordpress\nMYSQL_PASSWORD=%s\nWP_HOME=http://%s\nWP_SITEURL=http://%s\nPGVECTOR_PASSWORD=%s\n' \
              '$MYSQL_ROOT_PASSWORD' '$MYSQL_PASSWORD' '$DEPLOY_HOST' '$DEPLOY_HOST' '$PGVECTOR_PASSWORD' > .env;
            echo '✅ .env created';
          else echo '⏭ .env exists, skip'; fi"

      - name: Up stack
        run: ssh deploy 'cd /opt/szbolent-cn && docker compose up -d'

      - name: Apply mu-plugins (bookstore + ICP footer) + htaccess (幂等)
        run: |
          ssh deploy 'if docker ps --format "{{.Names}}" | grep -q "^bolent_wp$"; then
            docker exec bolent_wp mkdir -p /var/www/html/wp-content/mu-plugins
            docker cp /opt/szbolent-cn/mu-plugins/. bolent_wp:/var/www/html/wp-content/mu-plugins/
            docker exec bolent_wp chown -R www-data:www-data /var/www/html/wp-content/mu-plugins
            docker cp /opt/szbolent-cn/htaccess bolent_wp:/var/www/html/.htaccess
            docker exec bolent_wp chown www-data:www-data /var/www/html/.htaccess
            docker exec bolent_wp mkdir -p /var/www/html/wp-content/scripts
            docker cp /opt/szbolent-cn/scripts/. bolent_wp:/var/www/html/wp-content/scripts/
            docker exec bolent_wp chown -R www-data:www-data /var/www/html/wp-content/scripts
            echo "✅ mu-plugins + htaccess + scripts 已注入容器";
          else echo "⏭ bolent_wp 未运行，跳过"; fi'

      - name: Apply pgvector schema (幂等)
        run: |
          ssh deploy 'if docker ps --format "{{.Names}}" | grep -q "^pgvector$"; then
            docker exec -i pgvector psql -U postgres -f - < /opt/szbolent-cn/scripts/pgvector-schema.sql \
              && echo "✅ pgvector schema 已应用" || echo "⏭ pgvector schema 失败，检查密码/路径";
          else echo "⏭ pgvector 未运行，跳过"; fi'

      - name: Import 9,417 poems into WordPress (幂等)
        run: |
          ssh deploy 'if docker ps --format "{{.Names}}" | grep -q "^bolent_wp$"; then
            if [ -f /opt/szbolent-cn/bookstore-data/luyou.json ]; then
              docker exec bolent_wp mkdir -p /var/www/html/wp-content/uploads/bookstore
              docker cp /opt/szbolent-cn/bookstore-data/luyou.json bolent_wp:/var/www/html/wp-content/uploads/bookstore/luyou.json
              docker exec bolent_wp chown -R www-data:www-data /var/www/html/wp-content/uploads/bookstore
              docker exec bolent_wp php /var/www/html/wp-content/scripts/import-poems.php \
                && echo "✅ 诗词导入完成" || echo "⏭ 导入脚本报错";
            else echo "⏭ 缺少 luyou.json，跳过导入"; fi
          else echo "⏭ bolent_wp 未运行，跳过"; fi'

      - name: Phase B — apply modown theme/plugins if present (幂等)
        run: |
          ssh deploy 'if docker ps --format "{{.Names}}" | grep -q "^bolent_wp$"; then
            if [ -d /opt/szbolent-cn/themes ] && [ -n "$(ls -A /opt/szbolent-cn/themes 2>/dev/null)" ]; then
              docker cp /opt/szbolent-cn/themes/. bolent_wp:/var/www/html/wp-content/themes/
              docker exec bolent_wp chown -R www-data:www-data /var/www/html/wp-content/themes
              echo "✅ 主题已注入（含 modown）"; fi
            if [ -d /opt/szbolent-cn/plugins ] && [ -n "$(ls -A /opt/szbolent-cn/plugins 2>/dev/null)" ]; then
              docker cp /opt/szbolent-cn/plugins/. bolent_wp:/var/www/html/wp-content/plugins/
              docker exec bolent_wp chown -R www-data:www-data /var/www/html/wp-content/plugins
              echo "✅ 插件已注入（含 Lyanna/erphpdown）"; fi
          else echo "⏭ bolent_wp 未运行，跳过"; fi'

      - name: Activate modown theme + erphpdown plugin (幂等，书店上线收尾)
        run: |
          ssh deploy 'if docker ps --format "{{.Names}}" | grep -q "^bolent_wp$"; then
            docker exec bolent_wp php /var/www/html/wp-content/scripts/activate-bookstore.php \
              && echo "✅ 书店激活步骤完成" || echo "⏭ 激活脚本报错";
          else echo "⏭ bolent_wp 未运行，跳过"; fi'

      - name: Retire stale nginx confs (归档旧手写 conf，幂等)
        run: ssh deploy 'bash /opt/szbolent-cn/scripts/retire-stale-confs.sh'

      - name: Apply nginx config + reload
        run: |
          ssh deploy 'cp /opt/szbolent-cn/nginx/szbolent.conf /etc/nginx/conf.d/00-szbolent.conf && nginx -t && systemctl reload nginx || echo "⏭ nginx 跳过"'

      - name: Healthcheck
        run: ssh deploy 'bash /opt/szbolent-cn/scripts/healthcheck.sh'
