# =============================================================
# szbolent.cn 宿主 nginx 反代 — 云主机 <DEPLOY_HOST>
#   80 → 301 https；443 承载全部业务反代
#   证书: certbot / Let's Encrypt (/etc/letsencrypt/live/szbolent.cn)
#   续期: certbot-renew.timer 自动，nginx -s reload 无感
#   部署：/etc/nginx/conf.d/00-szbolent.conf，reload 生效
# =============================================================

server {
    listen 80 default_server;
    listen [::]:80;
    server_name _ szbolent.cn www.szbolent.cn szbolent.com.cn www.szbolent.com.cn bolent.cn www.bolent.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name szbolent.cn www.szbolent.cn;

    ssl_certificate     /etc/letsencrypt/live/szbolent.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szbolent.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # 门户/博客 → WordPress 容器
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ⚠️ 已知跨机依赖（待解耦）：/v1/ → api.genz.ltd（上游 API）
    #    保留以匹配现状；解耦后删除本段（见 CATALOG.md §三）。
    location /v1/ {
        proxy_pass http://api.genz.ltd/v1/;
        proxy_set_header Host api.genz.ltd;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }
}
